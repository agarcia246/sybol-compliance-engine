openapi: 3.0.0
info:
  title: Activity API
  version: 1.0.0
  description: API for activity-related endpoints

paths:
  /activity/system/status:
    get:
      summary: Get system status
      tags:
        - Activity
      responses:
        '200':
          description: System status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '500':
          description: Internal server error

  /activity/metrics/{userId}:
    get:
      summary: Get user metrics
      tags:
        - Activity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '500':
          description: Internal server error

  /activity/alerts:
    get:
      summary: Get alerts
      tags:
        - Activity
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Internal server error

  /activity/recent:
    get:
      summary: Get recent activity
      tags:
        - Activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Recent activity retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Internal server error