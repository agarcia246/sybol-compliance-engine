[project]
name = "sybol-compliance-engine"
version = "0.1.0"
description = "Compliance AI engine — QA test framework (Phase 1 foundation)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, isolated tests with no external services",
    "integration: tests that exercise wired-up components via mocks",
    "rag: RAG retrieval / synthesis evaluation",
    "scoring: media authenticity scoring tests",
    "vc: Verifiable Credential schema / issuance tests",
    "slow: longer-running tests, excluded from the fast CI gate",
]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
