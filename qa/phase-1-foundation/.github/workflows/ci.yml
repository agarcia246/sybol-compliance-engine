name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # When src/ deps exist, also: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type-check (mypy)
        run: mypy tests
        # extend to `mypy src tests` once src/ lands

      - name: Unit tests
        run: pytest -m unit

      - name: Integration tests
        run: pytest -m integration

      - name: Full suite + coverage
        run: pytest --cov --cov-report=term-missing
        # fail_under = 80 (pyproject.toml) gates the merge on src/ coverage
